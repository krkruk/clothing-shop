spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/clothingshop
    username: clothingshop
    password: clothingshop
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: clothingshop
  region: us-east-1

admin:
  username: admin
  password: admin
